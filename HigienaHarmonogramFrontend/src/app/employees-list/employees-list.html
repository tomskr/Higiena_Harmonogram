<div class="employees-container">
  <div class="header">
    <h1>Lista pracowników</h1>
    <button (click)="openModal()" class="btn-add">➕ Dodaj pracownika</button>
  </div>

  <div *ngIf="isLoading()" class="loading">
    <p>Ładowanie pracowników...</p>
  </div>

  <div *ngIf="error()" class="error">
    <p>{{ error() }}</p>
  </div>

  <div *ngIf="!isLoading() && !error()" class="employees-list">
    <div *ngIf="employees().length === 0" class="no-employees">
      <p>Brak pracowników w systemie</p>
    </div>

    <div *ngIf="employees().length > 0" class="list">
      <div *ngFor="let employee of employees()" class="employee-card">
        <div class="employee-header">
          <div class="employee-info">
            <h3>{{ employee.firstName }} {{ employee.lastName }}</h3>
            <div class="employee-details">
              <p *ngIf="employee.email"><strong>Email:</strong> {{ employee.email }}</p>
              <p *ngIf="employee.phone"><strong>Telefon:</strong> {{ employee.phone }}</p>
              <p *ngIf="employee.position"><strong>Stanowisko:</strong> {{ employee.position }}</p>
              <p *ngIf="employee.id"><strong>ID:</strong> {{ employee.id }}</p>
            </div>
          </div>
          <button 
            class="btn-delete" 
            (click)="deleteEmployee(employee.id)" 
            title="Usuń pracownika">
            🗑️
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal()" class="modal-overlay" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Dodaj nowego pracownika</h2>
      <button class="btn-close" (click)="closeModal()">✕</button>
    </div>

    <form (ngSubmit)="addEmployee()" class="modal-form">
      <div class="form-group">
        <label for="firstName">Imię *</label>
        <input
          type="text"
          id="firstName"
          [(ngModel)]="formData().firstName"
          name="firstName"
          placeholder="Wpisz imię"
          required
        />
      </div>

      <div class="form-group">
        <label for="lastName">Nazwisko *</label>
        <input
          type="text"
          id="lastName"
          [(ngModel)]="formData().lastName"
          name="lastName"
          placeholder="Wpisz nazwisko"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="formData().email"
          name="email"
          placeholder="Wpisz email"
        />
      </div>

      <div class="form-group">
        <label for="phone">Telefon</label>
        <input
          type="tel"
          id="phone"
          [(ngModel)]="formData().phone"
          name="phone"
          placeholder="Wpisz numer telefonu"
        />
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-cancel" (click)="closeModal()">Anuluj</button>
        <button type="submit" class="btn btn-submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Dodawanie...' : 'Dodaj pracownika' }}
        </button>
      </div>
    </form>
  </div>
</div>
